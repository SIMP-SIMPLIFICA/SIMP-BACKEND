name: CI — Validator + Test + Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # AGENT 1: Validator — lint + typecheck
  # Roda rápido, bloqueia o PR se falhar
  # ─────────────────────────────────────────────
  validate:
    name: Validator Agent (lint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npm run type-check

      - name: Lint
        run: npx --yes eslint src --ext .ts
        continue-on-error: true

  # ─────────────────────────────────────────────
  # AGENT 2: Test + Coverage
  # Requer banco e Redis reais para integração
  # ─────────────────────────────────────────────
  test:
    name: Test Agent (unit + integration + coverage)
    runs-on: ubuntu-latest
    needs: validate

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: simp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/simp_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-32-chars-minimum
      JWT_REFRESH_SECRET: test-refresh-secret-32-chars-minimum
      SESSION_SECRET: test-session-secret-32-chars-min
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: test
      SMTP_PASS: test
      SMTP_FROM: no-reply@test.com
      SMTP_FROM_NAME: SIMP Test
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      ENABLE_EMAIL_VERIFICATION: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --accept-data-loss

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # AGENT 3: Security — CodeQL scan
  # Roda em paralelo com os testes
  # ─────────────────────────────────────────────
  security:
    name: Security Agent (CodeQL)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
          queries: security-and-quality

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: backend-security
          upload: false
          upload-database: false

      - name: Save SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: /home/runner/work/_temp/codeql_databases
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # AGENT 4: Deploy — staging (develop) / prod (main)
  # Só roda após todos os outros passarem
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy Agent
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    steps:
      - name: Deploy to Staging (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          if [ -n "$HOOK" ]; then curl -s "$HOOK"; fi
        env:
          HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}

      - name: Deploy to Production (main)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$HOOK" ]; then curl -s "$HOOK"; fi
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
