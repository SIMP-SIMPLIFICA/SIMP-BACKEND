services:
  - type: web
    name: simp-backend-dev
    runtime: node
    region: oregon
    plan: free
    branch: develop
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate resolve --rolled-back 20260408032157_init || true && npx prisma migrate deploy
    startCommand: node dist/src/index.js
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # Preenchidos automaticamente pelo Render ao linkar os serviços abaixo
      - key: DATABASE_URL
        fromDatabase:
          name: simp-db-dev
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: simp-redis-dev
          type: redis
          property: connectionString

      # ── Secrets — preencher no dashboard do Render ──────────────────────────
      # (sync: false = o Render pede o valor manualmente, não fica no git)

      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false

      # URL do próprio serviço (preencher após saber a URL gerada pelo Render)
      - key: APP_URL
        sync: false

      # URL do frontend no Vercel (preencher após deploy do frontend)
      - key: FRONTEND_URL
        sync: false

      # CORS — mesma URL do frontend (pode incluir múltiplas separadas por vírgula)
      - key: CORS_ORIGIN
        sync: false

      # E-mail (SMTP) — pode usar Brevo, Resend, etc.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

      # Feature flags — desabilitados para dev
      - key: ENABLE_EMAIL_VERIFICATION
        value: "false"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info

  - type: redis
    name: simp-redis-dev
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: simp-db-dev
    plan: free
    region: oregon
    databaseName: simp_dev
    user: simp_dev
